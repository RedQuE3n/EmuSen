[package]
name = "emusen-core-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Cores' tool: libretro's catalogue and index, the installed cores, and later their download and install, run as jobs. See EmuSen_Cores.md §1, §4.2 and §6.
[lib]
name = "emusen_core_tool"

[dependencies]
emusen-core-entry = { path = "../core-entry" }
emusen-tool-job = { path = "../tool-job" }
emusen-galaxia = { path = "../galaxia" }
emusen-net = { path = "../net" }

# A TLS server of the test's own on 127.0.0.1 with certificates made at test time, as emusen-net's tests have; the same pins.
[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
