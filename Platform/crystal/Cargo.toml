[package]
name = "emusen-crystal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Crystal in Rust: the frontend API's types and numbers as emusen_crystal.h declares them, the tests that hold the
# header to its baseline and to the session service's table, and the runtime that serves the API, step B7. See
# EmuSen_Backend.md §3, §14 and §29.
[lib]
name = "emusen_crystal"

[dependencies]
# A session call's JSON arguments (service/args.rs).
serde_json.workspace = true
# A package's state records, read and written as a typed record (states.rs).
serde.workspace = true
# The core host: discovery from sidecars, trust, the v1 calls (EmuSen_Backend.md §27).
emusen-core-host = { path = "../../EmuSen/Cores/Shared/emusen-core-host" }
# Core info's JSON as the host reads it.
emusen-native = { path = "../../EmuSen/Cores/Shared/emusen-native" }
# The systems table, routing and the packs' rules.
emusen-systems = { path = "../systems" }
# The tree, the config files, the save names and the files a probe reads.
emusen-galaxia = { path = "../galaxia" }
# A packaged game's soft patches, applied to the image before create (EmuSen_GamePackages.md §5.4).
emusen-patch = { path = "../patch" }
# The firmware store: the folders searched, an image found, installed or located (EmuSen_Backend.md §15.1).
emusen-firmware = { path = "../firmware" }
# The card manager over the media's files (EmuSen_Backend.md §15.2).
emusen-savemedia = { path = "../savemedia" }
# The session service's numbers, which the API's statuses share.
emusen-session-service = { path = "../session-service" }
# The debugger at the frame's (b) points and the session service's answers over it (EmuSen_Backend.md §29.30).
emusen-crystal-debug = { path = "../crystal-debug" }
# The session's cheat registry, its files and the player's database, for the service's cheat calls.
emusen-cheats = { path = "../cheats" }
# The recorder, the frame's sixth step and record_start's.
emusen-recorder = { path = "../recorder" }
# states.db, through the SQLite the host lends (EmuSen_Backend.md §29.5, Q1).
emusen-sqlite = { path = "../sqlite" }
# A state's picture deflated into its PNG; the workspace's, as Galaxia takes it.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[[example]]
name = "crystal_test_core"
crate-type = ["cdylib"]

[[example]]
name = "crystal_console_core"
crate-type = ["cdylib"]

[dev-dependencies]
# Endymion's pads, so a test follows a core's motors to a simulated pad as a frontend hands them on (EmuSen_Input.md §9).
emusen-endymion = { path = "../endymion" }
