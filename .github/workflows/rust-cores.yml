# The Rust cores (EmuSen/Cores/RustCores.props), built and tested where they run, one library a crate a platform - see Mars_Native.md §6.3, Mercury_Native.md §8.6.
# The platform library (Platform/, emusen_platform) is built and tested beside them, since the WiseMan job needs both - see EmuSen_RustPlatform.md §2.7.
name: Rust cores

on:
  workflow_dispatch:
    inputs:
      full:
        description: Build every library, taking none from an earlier run
        type: boolean
        default: false
  push:
    paths:
      - 'EmuSen/Cores/Nintendo/MarsRT - N64/**'
      - 'EmuSen/Cores/Nintendo/MercuryRT - GB/**'
      - 'EmuSen/Cores/Nintendo/MoonRT - NES/**'
      - 'EmuSen/Cores/Nintendo/VenusRT - SNES/**'
      - 'EmuSen/Cores/Sega/Nephrite - Genesis/**'
      - 'EmuSen/Cores/Sega/Beryl-HW/**'
      - 'EmuSen/Cores/Sony/Diamond - PlayStation/**'
      - 'EmuSen/Cores/Sony/BlackMoon-HW/**'
      - 'EmuSen/Cores/Shared/**'
      - 'Platform/**'
      - 'EmuSen.Galaxia/**'
      - 'EmuSen.WiseMan/Galaxia/**'
      - 'EmuSen.Endymion/**'
      - 'EmuSen.WiseMan/Endymion/**'
      - 'EmuSen.Serenity/Slang/**'
      - 'EmuSen.Serenity/Native/**'
      - 'EmuSen.WiseMan/Serenity/Slang*'
      - 'EmuSen.WiseMan/Serenity/Spirv*'
      - 'EmuSen.WiseMan/Serenity/SerenityParity*'
      - 'EmuSen.WiseMan/Serenity/SerenityChainParity*'
      - 'EmuSen.WiseMan/Serenity/SerenitySwitch*'
      - 'EmuSen.DianaSh/**'
      - 'EmuSen.Crystal/**'
      - 'EmuSen.WiseMan/DianaSh/**'
      - 'EmuSen.WiseMan/Crystal/**'
      - 'EmuSen/Cores/RustCores.props'
      - 'EmuSen/Cores/RustCoresPublish.targets'
      - 'EmuSen/EmuSen.csproj'
      - 'EmuSen.WiseMan/Cores/MarsRt*'
      - 'EmuSen.WiseMan/Cores/MarsNative*'
      - 'EmuSen.WiseMan/Cores/MercuryRt*'
      - 'EmuSen.WiseMan/Cores/MoonRt*'
      - 'EmuSen.WiseMan/Cores/VenusRt*'
      - 'EmuSen.WiseMan/Cores/Nephrite*'
      - 'EmuSen.WiseMan/Cores/Diamond*'
      - 'EmuSen.WiseMan/Cores/CoreAbi*'
      - 'EmuSen.WiseMan/Cores/CoreAdapter*'
      - 'EmuSen.WiseMan/Cores/CoreDiscovery*'
      - 'EmuSen/Cores/Native/**'
      - '.github/workflows/rust-cores.yml'
      - '.github/scripts/library_key.py'
  # The core ABI's guard must see every pull request that could change version 1 (EmuSen_CoreAPI.md §5.4).
  pull_request:
    paths:
      - 'EmuSen/Cores/Nintendo/MarsRT - N64/**'
      - 'EmuSen/Cores/Nintendo/MercuryRT - GB/**'
      - 'EmuSen/Cores/Nintendo/MoonRT - NES/**'
      - 'EmuSen/Cores/Nintendo/VenusRT - SNES/**'
      - 'EmuSen/Cores/Sega/Nephrite - Genesis/**'
      - 'EmuSen/Cores/Sega/Beryl-HW/**'
      - 'EmuSen/Cores/Sony/Diamond - PlayStation/**'
      - 'EmuSen/Cores/Sony/BlackMoon-HW/**'
      - 'EmuSen/Cores/Shared/**'
      - 'Platform/**'
      - 'EmuSen.Galaxia/**'
      - 'EmuSen.WiseMan/Galaxia/**'
      - 'EmuSen.Endymion/**'
      - 'EmuSen.WiseMan/Endymion/**'
      - 'EmuSen.Serenity/Slang/**'
      - 'EmuSen.Serenity/Native/**'
      - 'EmuSen.WiseMan/Serenity/Slang*'
      - 'EmuSen.WiseMan/Serenity/Spirv*'
      - 'EmuSen.WiseMan/Serenity/SerenityParity*'
      - 'EmuSen.WiseMan/Serenity/SerenityChainParity*'
      - 'EmuSen.WiseMan/Serenity/SerenitySwitch*'
      - 'EmuSen.DianaSh/**'
      - 'EmuSen.Crystal/**'
      - 'EmuSen.WiseMan/DianaSh/**'
      - 'EmuSen.WiseMan/Crystal/**'
      - 'EmuSen/Cores/RustCores.props'
      - 'EmuSen/Cores/RustCoresPublish.targets'
      - 'EmuSen/EmuSen.csproj'
      - 'EmuSen.WiseMan/Cores/MarsRt*'
      - 'EmuSen.WiseMan/Cores/MarsNative*'
      - 'EmuSen.WiseMan/Cores/MercuryRt*'
      - 'EmuSen.WiseMan/Cores/MoonRt*'
      - 'EmuSen.WiseMan/Cores/VenusRt*'
      - 'EmuSen.WiseMan/Cores/Nephrite*'
      - 'EmuSen.WiseMan/Cores/Diamond*'
      - 'EmuSen.WiseMan/Cores/CoreAbi*'
      - 'EmuSen.WiseMan/Cores/CoreAdapter*'
      - 'EmuSen.WiseMan/Cores/CoreDiscovery*'
      - 'EmuSen/Cores/Native/**'
      - '.github/workflows/rust-cores.yml'
      - '.github/scripts/library_key.py'

jobs:
  # The crates every core builds with (EmuSen/Cores/Shared/), Beryl's (the Sega cores' shared CPUs and chips) and BlackMoon's (the Sony cores'), tested on their own; no library of theirs ships.
  shared:
    name: Shared crates ${{ matrix.os }}
    # Apple Silicon jobs of a working branch run on the project's Mac mini; main, tags and EMUSEN_MAC_RUNNER=off take GitHub's (EmuSen_RustPlatform.md §29).
    runs-on: ${{ matrix.os == 'macos-latest' && vars.EMUSEN_MAC_RUNNER != 'off' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && fromJSON('["self-hosted", "macOS", "ARM64", "emusen-mac"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS are paused while Linux is finished; EMUSEN_ALL_PLATFORMS=on brings them back (EmuSen_RustPlatform.md §31).
        os: ${{ fromJSON(vars.EMUSEN_ALL_PLATFORMS == 'on' && '["ubuntu-22.04", "windows-latest", "macos-latest"]' || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The ABI check needs libclang and runs in abi-guard alone.
      - name: Test
        shell: bash
        run: |
          for crate in EmuSen/Cores/Shared/*/ "EmuSen/Cores/Sega/Beryl-HW"/*/ "EmuSen/Cores/Sony/BlackMoon-HW"/*/; do
            case "$crate" in *emusen-core-abi-check/) continue ;; esac
            (cd "$crate" && cargo test --release)
          done

      # The platform's crates: their own rules with no .NET present, the header against the exports, and the header as C99 and C++17. Not yet a gate, as nothing of the platform's is until Galaxia's own (EmuSen_RustPlatform.md §3.9, §10.6): a failure here is reported and does not stop the cores.
      - name: Test the platform workspace
        continue-on-error: true
        shell: bash
        run: |
          (cd Platform && cargo test --release)
          case "$RUNNER_OS" in
            Windows) ;;
            *)
              cc -std=c99 -Wall -Wextra -pedantic -Werror -fsyntax-only -x c Platform/include/emusen_platform.h
              c++ -std=c++17 -Wall -Wextra -pedantic -Werror -fsyntax-only -x c++ Platform/include/emusen_platform.h
              cc -std=c99 -Wall -Wextra -pedantic -Werror -fsyntax-only -I Platform/dianash/include -x c Platform/dianash/include/dianash.h
              c++ -std=c++17 -Wall -Wextra -pedantic -Werror -fsyntax-only -I Platform/dianash/include -x c++ Platform/dianash/include/dianash.h
              ;;
          esac

      # The test core claims every capability, so all of version 1's exports are checked on each platform's linker.
      - name: The v1 test core's exports
        shell: bash
        run: |
          dir=EmuSen/Cores/Shared/emusen-native
          case "$RUNNER_OS" in
            Windows) lib=v1_test_core.dll ;;
            macOS) lib=libv1_test_core.dylib ;;
            *) lib=libv1_test_core.so ;;
          esac
          py=$(command -v python3 || command -v python)
          "$py" $dir/abi/v1/export_check.py $dir/abi/v1/baseline.txt $dir/target/release/examples/$lib
          "$py" $dir/abi/v1/export_check.py $dir/abi/v1/baseline.txt $dir/target/release/examples/${lib/test_core/plain_core}

      # The two test cores, for the WiseMan job's tests of the v1 adapter on the same platform.
      - uses: actions/upload-artifact@v4
        with:
          name: v1-test-cores-${{ runner.os }}
          path: |
            EmuSen/Cores/Shared/emusen-native/target/release/examples/*v1_test_core.*
            EmuSen/Cores/Shared/emusen-native/target/release/examples/*v1_plain_core.*
            EmuSen/Cores/Shared/emusen-core-conform/target/release/emusen-core-conform
            EmuSen/Cores/Shared/emusen-core-conform/target/release/emusen-core-conform.exe
          if-no-files-found: error

  # Diamond's open kernel (Diamond_OpenKernel.md §6, §7): its harness on blackmoon-r3000, and its image rebuilt by the pinned nightly to the committed bytes.
  diamond-kernel:
    name: Diamond's open kernel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The channel of kernel/rust-toolchain.toml, with the source build-std needs.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-01
          components: rust-src
      - name: Test, the rebuild required
        shell: bash
        env:
          DIAMOND_KERNEL_REBUILD: require
        run: |
          cd "EmuSen/Cores/Sony/Diamond - PlayStation/kernel-harness"
          cargo +stable test --release

  # The header against emusen-native's Rust and against the baseline on all four triples, and the base branch's baseline against this one: a removed or changed line fails (EmuSen_CoreAPI.md §5.2, §5.4).
  abi-guard:
    name: Core ABI guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - name: The base branch's baseline
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          path=EmuSen/Cores/Shared/emusen-native/abi/v1/baseline.txt
          if [ -n "$base" ] && git cat-file -e "$base:$path" 2>/dev/null; then
            git show "$base:$path" > "$RUNNER_TEMP/base-baseline.txt"
            echo "AGAINST=--against $RUNNER_TEMP/base-baseline.txt" >> "$GITHUB_ENV"
          else
            echo "no baseline at the base commit; checked against the header only"
          fi
      - name: The guard
        working-directory: EmuSen/Cores/Shared/emusen-core-abi-check
        run: |
          cargo test --release
          cargo run --release -- --check $AGAINST
      # DianaSh's host API and module ABI, stable from S3: the headers against the Rust, the facts against their baseline, and the base branch's baseline against this one (EmuSen_DianaSh.md §11.4, §13.7).
      - name: DianaSh's surfaces
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          path=Platform/dianash/abi/v1/baseline.txt
          if [ -n "$base" ] && git cat-file -e "$base:$path" 2>/dev/null; then
            git show "$base:$path" > "$RUNNER_TEMP/dianash-base-baseline.txt"
            export DIANASH_ABI_AGAINST="$RUNNER_TEMP/dianash-base-baseline.txt"
          fi
          cd Platform && cargo test --release -p emusen-platform --test dianash_abi
      # The frontend API, stable from its first commit: the header against the Rust types, against the session service's table
      # (every function's twin, both ways), C99 and C++17, and its baseline against the base branch's (EmuSen_Backend.md §3.2, §14).
      - name: The frontend API's surface
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          path=Platform/crystal/abi/v1/baseline.txt
          if [ -n "$base" ] && git cat-file -e "$base:$path" 2>/dev/null; then
            git show "$base:$path" > "$RUNNER_TEMP/crystal-base-baseline.txt"
            export CRYSTAL_ABI_AGAINST="$RUNNER_TEMP/crystal-base-baseline.txt"
          fi
          cd Platform && cargo test --release -p emusen-crystal --test crystal_abi

  # While Windows and macOS are paused, every crate is still compiled for them here, so their code cannot break unseen (EmuSen_RustPlatform.md §31).
  portable:
    name: Compiles for ${{ matrix.target }}
    if: vars.EMUSEN_ALL_PLATFORMS != 'on'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check every crate
        shell: bash
        run: |
          status=0
          for dir in "EmuSen/Cores/Nintendo/MarsRT - N64" "EmuSen/Cores/Nintendo/MercuryRT - GB" "EmuSen/Cores/Nintendo/MoonRT - NES" "EmuSen/Cores/Nintendo/VenusRT - SNES" "EmuSen/Cores/Sega/Nephrite - Genesis" "EmuSen/Cores/Sony/Diamond - PlayStation/v1" Platform EmuSen/Cores/Shared/*/ "EmuSen/Cores/Sega/Beryl-HW"/*/ "EmuSen/Cores/Sony/BlackMoon-HW"/*/; do
            case "$dir" in *emusen-core-abi-check/) continue ;; esac
            echo "::group::$dir"
            (cd "$dir" && cargo check --release --all-targets --target ${{ matrix.target }}) || { echo "::error::$dir does not compile for ${{ matrix.target }}"; status=1; }
            echo "::endgroup::"
          done
          exit $status

  # Which libraries this run builds, and which it takes from an earlier run's build of the same inputs; main, tags and a dispatch asking for it build every one (EmuSen_RustPlatform.md §28).
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4

      - name: The plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.full == true }}
          # The crates of RustCores.props, repeated because YAML cannot read it; symbol is the prefix of the exports the shim looks up.
          # Diamond's published library is v1/'s, which holds the machine with its enhancements (Diamond_Enhancements.md §24.1); emusen_platform is not a core but the platform library, built from its workspace and shipped the same way.
          CRATES: |
            [
              {"name": "marsrt", "dir": "EmuSen/Cores/Nintendo/MarsRT - N64", "symbol": "emusen_core_"},
              {"name": "mercuryrt", "dir": "EmuSen/Cores/Nintendo/MercuryRT - GB", "symbol": "emusen_native_"},
              {"name": "moonrt", "dir": "EmuSen/Cores/Nintendo/MoonRT - NES", "symbol": "emusen_native_"},
              {"name": "venusrt", "dir": "EmuSen/Cores/Nintendo/VenusRT - SNES", "symbol": "emusen_native_"},
              {"name": "nephrite", "dir": "EmuSen/Cores/Sega/Nephrite - Genesis", "symbol": "emusen_core_"},
              {"name": "diamond", "dir": "EmuSen/Cores/Sony/Diamond - PlayStation/v1", "symbol": "emusen_core_"},
              {"name": "emusen_platform", "dir": "Platform", "symbol": "emusen_galaxia_"}
            ]
          # ubuntu-22.04 for its glibc (2.35), so the library loads on older distributions than the one that built it; macOS is Apple Silicon only, as Intel Macs are not a target.
          PLATFORMS: |
            [
              {"rid": "linux-x64", "os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "prefix": "lib", "suffix": ".so", "test": true},
              {"rid": "win-x64", "os": "windows-latest", "target": "x86_64-pc-windows-msvc", "prefix": "", "suffix": ".dll", "test": true},
              {"rid": "osx-arm64", "os": "macos-latest", "target": "aarch64-apple-darwin", "prefix": "lib", "suffix": ".dylib", "test": true}
            ]
          ALL_PLATFORMS: ${{ vars.EMUSEN_ALL_PLATFORMS }}
        # Windows and macOS are paused while Linux is finished, so only linux-x64 is planned unless EMUSEN_ALL_PLATFORMS=on (EmuSen_RustPlatform.md §31).
        run: |
          if [ "$ALL_PLATFORMS" != on ]; then
            PLATFORMS=$(python3 -c 'import json, os; print(json.dumps([p for p in json.loads(os.environ["PLATFORMS"]) if p["rid"] == "linux-x64"]))')
            export PLATFORMS
          fi
          python3 .github/scripts/library_key.py plan

  library:
    name: ${{ matrix.crate.name }} ${{ matrix.platform.rid }}
    needs: plan
    if: needs.plan.outputs.build != '[]'
    # Apple Silicon jobs of a working branch run on the project's Mac mini; main, tags and EMUSEN_MAC_RUNNER=off take GitHub's (EmuSen_RustPlatform.md §29).
    runs-on: ${{ matrix.platform.os == 'macos-latest' && vars.EMUSEN_MAC_RUNNER != 'off' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && fromJSON('["self-hosted", "macOS", "ARM64", "emusen-mac"]') || matrix.platform.os }}
    # The platform library is optional while every component in it has its C# behind it, so its failure does not stop the cores' jobs (EmuSen_RustPlatform.md §10.6).
    continue-on-error: ${{ matrix.crate.name == 'emusen_platform' }}
    defaults:
      run:
        working-directory: ${{ matrix.crate.dir }}
    env:
      LIBRARY: ${{ matrix.platform.prefix }}${{ matrix.crate.name }}${{ matrix.platform.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v4

      # A crate with pgo/<name>.<target>.profdata: the toolchain its manifest pins, which the profile's names need, and a copy named by its hash, so a refreshed profile rebuilds what it guides; a target without one builds on stable, unguided and without a warning - see Mars_Native.md §6.17.
      - name: The PGO profile
        id: pgo
        shell: bash
        run: |
          profile="pgo/${{ matrix.crate.name }}.${{ matrix.platform.target }}.profdata"
          manifest="${profile%.profdata}.pgo"
          if [ -f "$profile" ]; then
            hash=$( (sha256sum "$profile" 2> /dev/null || shasum -a 256 "$profile") | cut -c1-16)
            mkdir -p ../../../../pgo-profile
            cp "$profile" "../../../../pgo-profile/${{ matrix.crate.name }}-$hash.profdata"
            cp "$manifest" "../../../../pgo-profile/${{ matrix.crate.name }}-$hash.pgo"
            printf 'toolchain=%s\n' "$(sed -n 's/^toolchain = //p' "$manifest")" >> "$GITHUB_OUTPUT"
            printf 'rustflags=%s\n' "-Cprofile-use=${{ github.workspace }}/pgo-profile/${{ matrix.crate.name }}-$hash.profdata -Cllvm-args=-no-pgo-warn-mismatch" >> "$GITHUB_OUTPUT"
          else
            printf 'toolchain=stable\n' >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pgo.outputs.toolchain }}
          targets: ${{ matrix.platform.target }}

      # The key of this build's inputs, as the plan computes it, under which a later run may take its library.
      - name: The input key
        id: key
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          py=$(command -v python3 || command -v python)
          printf 'key=%s\n' "$("$py" .github/scripts/library_key.py key "${{ matrix.crate.dir }}" ${{ matrix.crate.name }} ${{ matrix.platform.target }})" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '${{ matrix.crate.dir }} -> target'
          key: ${{ matrix.crate.name }}-${{ matrix.platform.rid }}

      # The crate's own suite; the games and the corpus skip without their files. MarsRT's block tests run compiled code, which is the check on each platform's JIT rules.
      - name: Test
        if: matrix.platform.test == true
        run: cargo test --release --target ${{ matrix.platform.target }}

      # Diamond's machine and its two layers beside its library, each its own crate with its own suite; the renderer's tests stand down without a Vulkan device.
      - name: Test Diamond's machine and layers
        if: matrix.crate.name == 'diamond' && matrix.platform.test == true
        shell: bash
        run: |
          for d in .. ../precision ../renderer; do
            (cd "$d" && cargo test --release --target ${{ matrix.platform.target }}) || exit 1
          done

      - name: Build
        env:
          CARGO_BUILD_RUSTFLAGS: ${{ steps.pgo.outputs.rustflags }}
        run: cargo build --profile dist --target ${{ matrix.platform.target }}

      # nano, the program the shell ships, beside the platform library with its manifest (EmuSen_DianaSh.md §7, §13.11).
      - name: The shell's program
        if: matrix.crate.name == 'emusen_platform'
        shell: bash
        run: cp dianash-program/nano.dianash.json "target/${{ matrix.platform.target }}/dist/"

      # The build script's verdict on the profile: guided, stale (a notice), or not trained for this toolchain's flavour (a warning: CI pins the toolchain so that it is).
      - name: The PGO verdict
        if: steps.pgo.outputs.rustflags != ''
        shell: bash
        run: |
          status="target/${{ matrix.platform.target }}/dist/${{ matrix.crate.name }}-pgo.txt"
          cat "$status"
          warning=$(sed -n 's/^warning = //p' "$status")
          note=$(sed -n 's/^note = //p' "$status")
          if [ -n "$warning" ]; then
            echo "::warning title=${{ matrix.crate.name }} ${{ matrix.platform.rid }}::$warning"
          elif [ -n "$note" ]; then
            echo "::notice title=${{ matrix.crate.name }} ${{ matrix.platform.rid }}::$note"
          else
            echo "::notice title=${{ matrix.crate.name }} ${{ matrix.platform.rid }}::profile-guided ($(sed -n 's/^state = //p' "$status"))"
          fi

      # A library on version 1: its exports against the baseline and its capability bits (EmuSen_CoreAPI.md §5.4 item 5); a pre-stable one is skipped by it and still counted below.
      - name: Exports
        shell: bash
        run: |
          file="target/${{ matrix.platform.target }}/dist/$LIBRARY"
          if [ "${{ matrix.platform.test }}" = "true" ]; then
            py=$(command -v python3 || command -v python)
            abi="${{ github.workspace }}/EmuSen/Cores/Shared/emusen-native/abi/v1"
            "$py" "$abi/export_check.py" "$abi/baseline.txt" "$file"
          fi
          case "${{ matrix.platform.rid }}" in
            win-*) ;;
            *) nm -gU "$file" 2>/dev/null | grep -c ' _\?${{ matrix.crate.symbol }}' || nm -D "$file" | grep -c ' ${{ matrix.crate.symbol }}' ;;
          esac
          ls -la "$file"

      # A library on the core ABI v1 gets its sidecar from the kit's runner, as the local build writes it (EmuSen_CoreAPI.md §22).
      - name: The sidecar
        if: matrix.platform.test == true
        shell: bash
        run: |
          file="target/${{ matrix.platform.target }}/dist/$LIBRARY"
          py=$(command -v python3 || command -v python)
          if "$py" -c "import ctypes, sys; sys.exit(0 if hasattr(ctypes.CDLL(sys.argv[1]), 'emusen_core_abi_version') else 1)" "$file"; then
            cargo run --release --manifest-path "${{ github.workspace }}/EmuSen/Cores/Shared/emusen-core-conform/Cargo.toml" -- --sidecar "$file" ${{ matrix.crate.development && '--development' || '' }}
          else
            echo "not on the core ABI v1: no sidecar"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.crate.name }}-${{ matrix.platform.rid }}
          path: |
            ${{ matrix.crate.dir }}/target/${{ matrix.platform.target }}/dist/${{ env.LIBRARY }}
            ${{ matrix.crate.dir }}/target/${{ matrix.platform.target }}/dist/${{ env.LIBRARY }}.core.json
            ${{ matrix.crate.dir }}/target/${{ matrix.platform.target }}/dist/nano*
          if-no-files-found: error

      # The same files under the input key, which a later run's plan looks up; none without a key or with an undeclared input.
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.key != '' && steps.key.outputs.key != 'undeclared'
        with:
          name: ${{ matrix.crate.name }}-${{ matrix.platform.rid }}-key-${{ steps.key.outputs.key }}
          path: |
            ${{ matrix.crate.dir }}/target/${{ matrix.platform.target }}/dist/${{ env.LIBRARY }}
            ${{ matrix.crate.dir }}/target/${{ matrix.platform.target }}/dist/${{ env.LIBRARY }}.core.json
          if-no-files-found: error

  # A library an earlier run built from the same inputs, which the plan has opened and checked, uploaded under this run's name.
  reuse:
    name: ${{ matrix.name }} ${{ matrix.rid }} (reused)
    needs: plan
    if: needs.plan.outputs.reuse != '[]'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.reuse) }}
    steps:
      - name: The earlier build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${{ github.repository }}/actions/artifacts/${{ matrix.artifact }}/zip" > library.zip
          mkdir library && unzip -q library.zip -d library
          test -s "library/${{ matrix.library }}"
          ls -la library

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ matrix.rid }}
          path: library/
          if-no-files-found: error

  # WiseMan's tests of the Rust cores against the C# cores, run on each platform against the libraries the job above ships.
  wiseman:
    name: WiseMan ${{ matrix.rid }}
    needs: [plan, library, reuse, shared]
    # A library job or a reuse job with nothing to do is skipped, and every library is still there (EmuSen_RustPlatform.md §28).
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.shared.result == 'success' && needs.library.result != 'failure' && needs.reuse.result != 'failure' }}
    # Apple Silicon jobs of a working branch run on the project's Mac mini; main, tags and EMUSEN_MAC_RUNNER=off take GitHub's (EmuSen_RustPlatform.md §29).
    runs-on: ${{ matrix.os == 'macos-latest' && vars.EMUSEN_MAC_RUNNER != 'off' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && fromJSON('["self-hosted", "macOS", "ARM64", "emusen-mac"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # linux-x64 on 24.04, not the library job's 22.04: the tests load SDL3's prebuilt native library, which needs glibc 2.38 (22.04 has 2.35). Windows and macOS only with EMUSEN_ALL_PLATFORMS=on (EmuSen_RustPlatform.md §31).
        include: ${{ fromJSON(vars.EMUSEN_ALL_PLATFORMS == 'on' && '[{"rid":"linux-x64","os":"ubuntu-24.04"},{"rid":"win-x64","os":"windows-latest"},{"rid":"osx-arm64","os":"macos-latest"}]' || '[{"rid":"linux-x64","os":"ubuntu-24.04"}]') }}
    steps:
      # LunaP.props takes the toolkit from the sibling checkout, so both are checked out side by side.
      - uses: actions/checkout@v4
        with:
          path: EmuSen-Project

      - uses: actions/checkout@v4
        with:
          repository: RedQuE3n/EmuSen.LunaP
          ref: openemu-library
          path: EmuSen.LunaP

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: marsrt-${{ matrix.rid }}
          path: native

      - uses: actions/download-artifact@v4
        with:
          name: mercuryrt-${{ matrix.rid }}
          path: native

      - uses: actions/download-artifact@v4
        with:
          name: moonrt-${{ matrix.rid }}
          path: native

      - uses: actions/download-artifact@v4
        with:
          name: venusrt-${{ matrix.rid }}
          path: native

      - uses: actions/download-artifact@v4
        with:
          name: nephrite-${{ matrix.rid }}
          path: native

      - uses: actions/download-artifact@v4
        with:
          name: diamond-${{ matrix.rid }}
          path: native

      # Absent when its job failed; the tests that need it then say so, and the rest run.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: emusen_platform-${{ matrix.rid }}
          path: native

      - uses: actions/download-artifact@v4
        with:
          name: v1-test-cores-${{ runner.os }}
          path: native

      # EmuSenNative=false: cargo stays out of this build, and the tests load the shipped libraries.
      - name: Build
        working-directory: EmuSen-Project
        run: dotnet build EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release -p:EmuSenNative=false

      - name: The libraries beside the tests
        shell: bash
        run: |
          out=EmuSen-Project/EmuSen.WiseMan/bin/Release/net10.0
          # The test cores' artefact keeps its two crates' folders, since it holds the kit's runner too; every file goes beside the tests.
          find native -type f -exec cp {} "$out/" \;
          chmod +x "$out"/emusen-core-conform* || true
          # The shell's shipped program goes where the shell looks for it, dianash/ beside the tests (EmuSen_DianaSh.md §7).
          mkdir -p "$out/dianash"
          for f in native/nano native/nano.exe native/nano.dianash.json; do if [ -f "$f" ]; then mv "$f" "$out/dianash/"; rm -f "$out/$(basename "$f")"; fi; done
          chmod +x "$out/dianash/nano" 2>/dev/null || true
          ls -la "$out"/*marsrt* "$out"/*mercuryrt* "$out"/*moonrt* "$out"/*venusrt* "$out"/*nephrite* "$out"/*diamond* "$out"/*v1_test_core* "$out"/*v1_plain_core*
          ls -la "$out"/*emusen_platform* || echo "no platform library: Galaxia runs on its C#"

      # Printed in full, so each platform's digests can be read off the log.
      - name: Test the platform digests
        working-directory: EmuSen-Project
        run: dotnet test EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release --no-build --filter "FullyQualifiedName~MercuryRtPlatformTests" --logger "console;verbosity=detailed"

      - name: Test the Rust cores against the C# cores
        working-directory: EmuSen-Project
        run: dotnet test EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release --no-build --filter "FullyQualifiedName~MarsRt|FullyQualifiedName~MarsRT|FullyQualifiedName~MarsNative|FullyQualifiedName~MercuryRt|FullyQualifiedName~MoonRtState|FullyQualifiedName~VenusRtTestRomRunner|FullyQualifiedName~CoreAbi|FullyQualifiedName~CoreAdapter|FullyQualifiedName~CoreDiscovery|FullyQualifiedName~MoonRtCoreAbi|FullyQualifiedName~MercuryRtCoreAbi|FullyQualifiedName~Nephrite|FullyQualifiedName~Diamond|FullyQualifiedName~TestRomRunner" --logger "console;verbosity=normal" --logger "trx;LogFileName=wiseman-${{ matrix.rid }}.trx" --results-directory "${{ github.workspace }}/results"

      # The platform's steps run whatever the cores' comparison above found, since neither depends on the other (EmuSen_RustPlatform.md §27.3).
      # Galaxia on its C#, which EMUSEN_GALAXIA_NATIVE=0 selects. These tests had not run on Windows or macOS before step 2a, so it reports and does not yet gate.
      - name: Test Galaxia on its C#
        if: ${{ !cancelled() }}
        working-directory: EmuSen-Project
        continue-on-error: true
        env:
          EMUSEN_GALAXIA_NATIVE: '0'
        run: dotnet test EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release --no-build --filter "(FullyQualifiedName~EmuSen.WiseMan.Galaxia.|FullyQualifiedName~DianaShSandboxTests|FullyQualifiedName~HierTests)&FullyQualifiedName!~GalaxiaParityTests" --logger "console;verbosity=normal"

      # The same tests through the platform library, which is Galaxia's default since step 2c, and the parity class beside them; still reporting, since a platform without the library falls back to the C# (EmuSen_RustPlatform.md §13).
      - name: Test Galaxia on the platform library
        if: ${{ !cancelled() }}
        working-directory: EmuSen-Project
        continue-on-error: true
        run: dotnet test EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release --no-build --filter "FullyQualifiedName~EmuSen.WiseMan.Galaxia.|FullyQualifiedName~DianaShSandboxTests|FullyQualifiedName~HierTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=galaxia-${{ matrix.rid }}.trx" --results-directory "${{ github.workspace }}/results"

      # Endymion on its C#, which EMUSEN_ENDYMION_NATIVE=0 selects since its state 2: the pad and audio tests on simulated pads and SDL's dummy driver; reported, not yet a gate, as Galaxia's steps above.
      - name: Test Endymion on its C#
        if: ${{ !cancelled() }}
        working-directory: EmuSen-Project
        continue-on-error: true
        env:
          EMUSEN_ENDYMION_NATIVE: '0'
        run: dotnet test EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release --no-build --filter "(FullyQualifiedName~EmuSen.WiseMan.Audio.|FullyQualifiedName~EmuSen.WiseMan.Input.|FullyQualifiedName~EmuSen.WiseMan.Endymion.|FullyQualifiedName~AudioProperties)&FullyQualifiedName!~EndymionParityTests&FullyQualifiedName!~EndymionDeviceParityTests" --logger "console;verbosity=normal"

      # The same through the platform library, Endymion's default since its state 2, with the parity classes that hold the library to the C# (EmuSen_RustPlatform.md §12.5, §14.5, §19).
      - name: Test Endymion on the platform library
        if: ${{ !cancelled() }}
        working-directory: EmuSen-Project
        continue-on-error: true
        run: dotnet test EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release --no-build --filter "FullyQualifiedName~EmuSen.WiseMan.Audio.|FullyQualifiedName~EmuSen.WiseMan.Input.|FullyQualifiedName~EmuSen.WiseMan.Endymion.|FullyQualifiedName~AudioProperties" --logger "console;verbosity=normal" --logger "trx;LogFileName=endymion-${{ matrix.rid }}.trx" --results-directory "${{ github.workspace }}/results"

      # Serenity's slang half on its C#, which EMUSEN_SERENITY_NATIVE=0 selects since its state 2: presets, sources, the compiler, reflection, the cache, the device and the chain; the tests that need a Vulkan device pass by without one. Reported, not yet a gate.
      - name: Test Serenity's slang half on its C#
        if: ${{ !cancelled() }}
        working-directory: EmuSen-Project
        continue-on-error: true
        env:
          EMUSEN_SERENITY_NATIVE: '0'
        run: dotnet test EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release --no-build --filter "(FullyQualifiedName~EmuSen.WiseMan.Serenity.Slang|FullyQualifiedName~EmuSen.WiseMan.Serenity.Spirv)&FullyQualifiedName!~SerenityParityTests" --logger "console;verbosity=normal"

      # The same through the platform library, Serenity's default since its state 2, with the parity classes that hold the library to the C# (EmuSen_RustPlatform.md §16.5, §17.5, §19).
      - name: Test Serenity's slang half on the platform library
        if: ${{ !cancelled() }}
        working-directory: EmuSen-Project
        continue-on-error: true
        run: dotnet test EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release --no-build --filter "FullyQualifiedName~EmuSen.WiseMan.Serenity.Slang|FullyQualifiedName~EmuSen.WiseMan.Serenity.Spirv|FullyQualifiedName~SerenityParityTests|FullyQualifiedName~SerenityChainParityTests|FullyQualifiedName~SerenitySwitchTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=serenity-${{ matrix.rid }}.trx" --results-directory "${{ github.workspace }}/results"

      # DianaSh on the Rust shell, its default since S6's state 2, with the text tools and EmuSen's command modules linked
      # into the platform library: the golden corpus, the shell's tests and the session service's, on each system. The
      # switch test says in the log which shell ran and fails if it was not the Rust one (EmuSen_DianaSh.md §13.10, §13.11).
      - name: Test DianaSh on the Rust shell
        if: ${{ !cancelled() }}
        working-directory: EmuSen-Project
        continue-on-error: true
        env:
          EMUSEN_DIANASH_EXPECT: rust
        run: dotnet test EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release --no-build --filter "FullyQualifiedName~EmuSen.WiseMan.DianaSh.|FullyQualifiedName~SessionServiceParityTests|FullyQualifiedName~SessionHeaderTests" --logger "console;verbosity=detailed" --logger "trx;LogFileName=dianash-${{ matrix.rid }}.trx" --results-directory "${{ github.workspace }}/results"

      # The same on the C# shell, the failover EMUSEN_DIANASH_NATIVE=0 selects until S7; reported beside the Rust shell's.
      - name: Test DianaSh on its C#
        if: ${{ !cancelled() }}
        working-directory: EmuSen-Project
        continue-on-error: true
        env:
          EMUSEN_DIANASH_NATIVE: '0'
          EMUSEN_DIANASH_EXPECT: 'c#'
        run: dotnet test EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release --no-build --filter "FullyQualifiedName~EmuSen.WiseMan.DianaSh.|FullyQualifiedName~SessionServiceParityTests|FullyQualifiedName~SessionHeaderTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=dianash-csharp-${{ matrix.rid }}.trx" --results-directory "${{ github.workspace }}/results"

      # The frontend API on its C# implementation: the header against the binding and the implementation, the contract
      # layer's shape, the API's groups and the divergence rows (EmuSen_Backend.md §14).
      - name: Test the frontend API
        if: ${{ !cancelled() }}
        working-directory: EmuSen-Project
        continue-on-error: true
        run: dotnet test EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release --no-build --filter "FullyQualifiedName~CrystalHeaderTests|FullyQualifiedName~ContractShapeTests|FullyQualifiedName~ManagedCrystal|FullyQualifiedName~DivergenceRowTests|FullyQualifiedName~FrontendDefectTests|FullyQualifiedName~FrontendReferenceTests|FullyQualifiedName~HotaruOnTheApiTests|FullyQualifiedName~StateRefusalTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=crystal-${{ matrix.rid }}.trx" --results-directory "${{ github.workspace }}/results"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiseman-${{ matrix.rid }}
          path: results
          if-no-files-found: ignore
