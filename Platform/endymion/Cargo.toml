[package]
name = "emusen-endymion"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Endymion: the resampler, the rate control, the pad's vocabulary, the seats and the route to the ports, and the devices: SDL's pads and audio, and simulated pads. See EmuSen_RustPlatform.md §4.2, §12 and §14.
[lib]
name = "emusen_endymion"

[dependencies]
# SDL3, loaded at run time from the file the program ships (§2.8).
libloading = "0.9"
# A simulated pad's GUID, the MD5 of its name, as the C# makes it.
md-5 = "0.11"
