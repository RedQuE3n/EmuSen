[package]
name = "emusen-core-conform"
version = "0.1.0"
edition = "2024"
publish = false

# The conformance kit's core suite: loads a library through the core ABI v1 and nothing else, and runs C1-C17 on an
# image its author supplies, or on a library of images; also writes a library's sidecar. See EmuSen_CoreAPI.md §12,
# §21, §24 and §28.
[lib]
name = "emusen_core_conform"

[[bin]]
name = "emusen-core-conform"
path = "src/main.rs"

[dependencies]
emusen-native = { path = "../emusen-native" }
# The set module, which names a sheet's companions as the runtime's reading does (EmuSen_CoreAPI_Extensions.md §2.3).
emusen-disc = { path = "../emusen-disc" }
# Galaxia's mapped file, the one place a file is mapped, for the case that lends an image as a host does (C17).
emusen-galaxia = { path = "../../../../Platform/galaxia" }
libloading = "0.8"
# Vulkan's declarations and loader, for C20's lender (EmuSen_CoreAPI.md §6.29); the version emusen-gpu takes.
ash = "0.38"

# The two test cores, built here as well so that this crate's tests run the kit on them.
[[example]]
name = "kit_test_core"
crate-type = ["cdylib"]

[[example]]
name = "kit_plain_core"
crate-type = ["cdylib"]

[[example]]
name = "kit_faulty_core"
crate-type = ["cdylib"]

[[example]]
name = "kit_lenient_core"
crate-type = ["cdylib"]

[[example]]
name = "kit_faulty_full_core"
crate-type = ["cdylib"]

[[example]]
name = "kit_settling_core"
crate-type = ["cdylib"]

[[example]]
name = "kit_slow_core"
crate-type = ["cdylib"]

[[example]]
name = "kit_hung_core"
crate-type = ["cdylib"]

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true
