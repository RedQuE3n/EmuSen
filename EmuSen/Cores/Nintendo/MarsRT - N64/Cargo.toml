[package]
name = "marsrt"
version = "0.1.0"
edition = "2024"
publish = false

# MarsRT, the N64 core in Rust, and the C# Mars's opt-in native components, behind a C ABI. See Mars_Native.md.
[lib]
name = "marsrt"
crate-type = ["cdylib", "rlib"]

[dependencies]
emusen-native = { path = "../../Shared/emusen-native" }
# The device path's Vulkan compute device, `ash` behind it with the loader found at run time. See Hardware/Shared/EmuSen_Gpu.md.
emusen-gpu = { path = "../../Shared/emusen-gpu" }
# The recompiler's thread, publication, module, code budget and verifier, shared with the PlayStation 2's recompilers. See Hardware/Shared/EmuSen_Jit.md.
emusen-jit = { path = "../../Shared/emusen-jit" }
# The recompiler's code generator, which the emitter writes IR for; Apache-2.0 WITH LLVM-exception, compatible with the GPL-3.0. See Mars_Native.md §5.8.
cranelift-codegen = "0.136.0"
cranelift-frontend = "0.136.0"
cranelift-jit = "0.136.0"
cranelift-module = "0.136.0"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# What ships: release without the line tables ipsample and the perf map read - see Mars_Native.md §6.3.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true
