# The Rust cores (EmuSen/Cores/RustCores.props), built and tested where they run, one library a crate a platform - see Mars_Native.md §6.3, Mercury_Native.md §8.6.
name: Rust cores

on:
  workflow_dispatch:
  push:
    paths:
      - 'EmuSen/Cores/Nintendo/MarsRT - N64/**'
      - 'EmuSen/Cores/Nintendo/MercuryRT - GB/**'
      - 'EmuSen/Cores/Nintendo/MoonRT - NES/**'
      - 'EmuSen/Cores/Nintendo/VenusRT - SNES/**'
      - 'EmuSen/Cores/Shared/**'
      - 'EmuSen/Cores/RustCores.props'
      - 'EmuSen/Cores/RustCoresPublish.targets'
      - 'EmuSen/EmuSen.csproj'
      - 'EmuSen.WiseMan/Cores/MarsRt*'
      - 'EmuSen.WiseMan/Cores/MarsNative*'
      - 'EmuSen.WiseMan/Cores/MercuryRt*'
      - 'EmuSen.WiseMan/Cores/MoonRt*'
      - 'EmuSen.WiseMan/Cores/VenusRt*'
      - 'EmuSen.WiseMan/Cores/CoreAbi*'
      - 'EmuSen.WiseMan/Cores/CoreAdapter*'
      - 'EmuSen.WiseMan/Cores/CoreDiscovery*'
      - 'EmuSen/Cores/Native/**'
      - '.github/workflows/rust-cores.yml'
  # The core ABI's guard must see every pull request that could change version 1 (EmuSen_CoreAPI.md §5.4).
  pull_request:
    paths:
      - 'EmuSen/Cores/Nintendo/MarsRT - N64/**'
      - 'EmuSen/Cores/Nintendo/MercuryRT - GB/**'
      - 'EmuSen/Cores/Nintendo/MoonRT - NES/**'
      - 'EmuSen/Cores/Nintendo/VenusRT - SNES/**'
      - 'EmuSen/Cores/Shared/**'
      - 'EmuSen/Cores/RustCores.props'
      - 'EmuSen/Cores/RustCoresPublish.targets'
      - 'EmuSen/EmuSen.csproj'
      - 'EmuSen.WiseMan/Cores/MarsRt*'
      - 'EmuSen.WiseMan/Cores/MarsNative*'
      - 'EmuSen.WiseMan/Cores/MercuryRt*'
      - 'EmuSen.WiseMan/Cores/MoonRt*'
      - 'EmuSen.WiseMan/Cores/VenusRt*'
      - 'EmuSen.WiseMan/Cores/CoreAbi*'
      - 'EmuSen.WiseMan/Cores/CoreAdapter*'
      - 'EmuSen.WiseMan/Cores/CoreDiscovery*'
      - 'EmuSen/Cores/Native/**'
      - '.github/workflows/rust-cores.yml'

jobs:
  # The crates every core builds with (EmuSen/Cores/Shared/), tested on their own; no library of theirs ships.
  shared:
    name: Shared crates ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The ABI check needs libclang and runs in abi-guard alone.
      - name: Test
        shell: bash
        run: |
          for crate in EmuSen/Cores/Shared/*/; do
            case "$crate" in *emusen-core-abi-check/) continue ;; esac
            (cd "$crate" && cargo test --release)
          done

      # The test core claims every capability, so all of version 1's exports are checked on each platform's linker.
      - name: The v1 test core's exports
        shell: bash
        run: |
          dir=EmuSen/Cores/Shared/emusen-native
          case "$RUNNER_OS" in
            Windows) lib=v1_test_core.dll ;;
            macOS) lib=libv1_test_core.dylib ;;
            *) lib=libv1_test_core.so ;;
          esac
          py=$(command -v python3 || command -v python)
          "$py" $dir/abi/v1/export_check.py $dir/abi/v1/baseline.txt $dir/target/release/examples/$lib
          "$py" $dir/abi/v1/export_check.py $dir/abi/v1/baseline.txt $dir/target/release/examples/${lib/test_core/plain_core}

      # The two test cores, for the WiseMan job's tests of the v1 adapter on the same platform.
      - uses: actions/upload-artifact@v4
        with:
          name: v1-test-cores-${{ runner.os }}
          path: |
            EmuSen/Cores/Shared/emusen-native/target/release/examples/*v1_test_core.*
            EmuSen/Cores/Shared/emusen-native/target/release/examples/*v1_plain_core.*
            EmuSen/Cores/Shared/emusen-core-conform/target/release/emusen-core-conform
            EmuSen/Cores/Shared/emusen-core-conform/target/release/emusen-core-conform.exe
          if-no-files-found: error

  # The header against emusen-native's Rust and against the baseline on all four triples, and the base branch's baseline against this one: a removed or changed line fails (EmuSen_CoreAPI.md §5.2, §5.4).
  abi-guard:
    name: Core ABI guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - name: The base branch's baseline
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          path=EmuSen/Cores/Shared/emusen-native/abi/v1/baseline.txt
          if [ -n "$base" ] && git cat-file -e "$base:$path" 2>/dev/null; then
            git show "$base:$path" > "$RUNNER_TEMP/base-baseline.txt"
            echo "AGAINST=--against $RUNNER_TEMP/base-baseline.txt" >> "$GITHUB_ENV"
          else
            echo "no baseline at the base commit; checked against the header only"
          fi
      - name: The guard
        working-directory: EmuSen/Cores/Shared/emusen-core-abi-check
        run: |
          cargo test --release
          cargo run --release -- --check $AGAINST

  library:
    name: ${{ matrix.crate.name }} ${{ matrix.platform.rid }}
    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        working-directory: ${{ matrix.crate.dir }}
    env:
      LIBRARY: ${{ matrix.platform.prefix }}${{ matrix.crate.name }}${{ matrix.platform.suffix }}
    strategy:
      fail-fast: false
      matrix:
        # The crates of RustCores.props, repeated because YAML cannot read it; symbol is the prefix of the exports the shim looks up.
        crate:
          - name: marsrt
            dir: 'EmuSen/Cores/Nintendo/MarsRT - N64'
            symbol: mars_
          - name: mercuryrt
            dir: 'EmuSen/Cores/Nintendo/MercuryRT - GB'
            symbol: emusen_native_
          - name: moonrt
            dir: 'EmuSen/Cores/Nintendo/MoonRT - NES'
            symbol: emusen_native_
          - name: venusrt
            dir: 'EmuSen/Cores/Nintendo/VenusRT - SNES'
            symbol: emusen_native_
        platform:
          # ubuntu-22.04 for its glibc (2.35), so the library loads on older distributions than the one that built it.
          - rid: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            prefix: lib
            suffix: .so
            test: true
          - rid: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            prefix: ''
            suffix: .dll
            test: true
          - rid: osx-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            prefix: lib
            suffix: .dylib
            test: true
          # Built on the arm64 runner with Apple's toolchain, which links x86_64; its tests run under Rosetta and may not.
          - rid: osx-x64
            os: macos-latest
            target: x86_64-apple-darwin
            prefix: lib
            suffix: .dylib
            test: rosetta
    steps:
      - uses: actions/checkout@v4

      # A crate with pgo/<name>.<target>.profdata: the toolchain its manifest pins, which the profile's names need, and a copy named by its hash, so a refreshed profile rebuilds what it guides; a target without one builds on stable, unguided and without a warning - see Mars_Native.md §6.17.
      - name: The PGO profile
        id: pgo
        shell: bash
        run: |
          profile="pgo/${{ matrix.crate.name }}.${{ matrix.platform.target }}.profdata"
          manifest="${profile%.profdata}.pgo"
          if [ -f "$profile" ]; then
            hash=$( (sha256sum "$profile" 2> /dev/null || shasum -a 256 "$profile") | cut -c1-16)
            mkdir -p ../../../../pgo-profile
            cp "$profile" "../../../../pgo-profile/${{ matrix.crate.name }}-$hash.profdata"
            cp "$manifest" "../../../../pgo-profile/${{ matrix.crate.name }}-$hash.pgo"
            printf 'toolchain=%s\n' "$(sed -n 's/^toolchain = //p' "$manifest")" >> "$GITHUB_OUTPUT"
            printf 'rustflags=%s\n' "-Cprofile-use=${{ github.workspace }}/pgo-profile/${{ matrix.crate.name }}-$hash.profdata -Cllvm-args=-no-pgo-warn-mismatch" >> "$GITHUB_OUTPUT"
          else
            printf 'toolchain=stable\n' >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pgo.outputs.toolchain }}
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '${{ matrix.crate.dir }} -> target'
          key: ${{ matrix.crate.name }}-${{ matrix.platform.rid }}

      # The crate's own suite; the games and the corpus skip without their files. MarsRT's block tests run compiled code, which is the check on each platform's JIT rules.
      - name: Test
        if: matrix.platform.test == true
        run: cargo test --release --target ${{ matrix.platform.target }}

      - name: Test under Rosetta
        if: matrix.platform.test == 'rosetta'
        continue-on-error: true
        run: cargo test --release --target ${{ matrix.platform.target }}

      - name: Build
        env:
          CARGO_BUILD_RUSTFLAGS: ${{ steps.pgo.outputs.rustflags }}
        run: cargo build --profile dist --target ${{ matrix.platform.target }}

      # The build script's verdict on the profile: guided, stale (a notice), or not trained for this toolchain's flavour (a warning: CI pins the toolchain so that it is).
      - name: The PGO verdict
        if: steps.pgo.outputs.rustflags != ''
        shell: bash
        run: |
          status="target/${{ matrix.platform.target }}/dist/${{ matrix.crate.name }}-pgo.txt"
          cat "$status"
          warning=$(sed -n 's/^warning = //p' "$status")
          note=$(sed -n 's/^note = //p' "$status")
          if [ -n "$warning" ]; then
            echo "::warning title=${{ matrix.crate.name }} ${{ matrix.platform.rid }}::$warning"
          elif [ -n "$note" ]; then
            echo "::notice title=${{ matrix.crate.name }} ${{ matrix.platform.rid }}::$note"
          else
            echo "::notice title=${{ matrix.crate.name }} ${{ matrix.platform.rid }}::profile-guided ($(sed -n 's/^state = //p' "$status"))"
          fi

      # A library on version 1: its exports against the baseline and its capability bits (EmuSen_CoreAPI.md §5.4 item 5); a pre-stable one is skipped by it and still counted below. Not on osx-x64, whose library this runner's Python cannot load.
      - name: Exports
        shell: bash
        run: |
          file="target/${{ matrix.platform.target }}/dist/$LIBRARY"
          if [ "${{ matrix.platform.test }}" = "true" ]; then
            py=$(command -v python3 || command -v python)
            abi="${{ github.workspace }}/EmuSen/Cores/Shared/emusen-native/abi/v1"
            "$py" "$abi/export_check.py" "$abi/baseline.txt" "$file"
          fi
          case "${{ matrix.platform.rid }}" in
            win-*) ;;
            *) nm -gU "$file" 2>/dev/null | grep -c ' _\?${{ matrix.crate.symbol }}' || nm -D "$file" | grep -c ' ${{ matrix.crate.symbol }}' ;;
          esac
          ls -la "$file"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.crate.name }}-${{ matrix.platform.rid }}
          path: ${{ matrix.crate.dir }}/target/${{ matrix.platform.target }}/dist/${{ env.LIBRARY }}
          if-no-files-found: error

  # WiseMan's tests of the Rust cores against the C# cores, run on each platform against the libraries the job above ships; osx-x64 is left out, its runner being arm64.
  wiseman:
    name: WiseMan ${{ matrix.rid }}
    needs: [library, shared]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            # 24.04, not the library job's 22.04: the tests load SDL3's prebuilt native library, which needs glibc 2.38 (22.04 has 2.35).
            os: ubuntu-24.04
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
    steps:
      # LunaP.props takes the toolkit from the sibling checkout, so both are checked out side by side.
      - uses: actions/checkout@v4
        with:
          path: EmuSen-Project

      - uses: actions/checkout@v4
        with:
          repository: RedQuE3n/EmuSen.LunaP
          ref: openemu-library
          path: EmuSen.LunaP

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: marsrt-${{ matrix.rid }}
          path: native

      - uses: actions/download-artifact@v4
        with:
          name: mercuryrt-${{ matrix.rid }}
          path: native

      - uses: actions/download-artifact@v4
        with:
          name: moonrt-${{ matrix.rid }}
          path: native

      - uses: actions/download-artifact@v4
        with:
          name: venusrt-${{ matrix.rid }}
          path: native

      - uses: actions/download-artifact@v4
        with:
          name: v1-test-cores-${{ runner.os }}
          path: native

      # EmuSenNative=false: cargo stays out of this build, and the tests load the shipped libraries.
      - name: Build
        working-directory: EmuSen-Project
        run: dotnet build EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release -p:EmuSenNative=false

      - name: The libraries beside the tests
        shell: bash
        run: |
          out=EmuSen-Project/EmuSen.WiseMan/bin/Release/net10.0
          cp native/* "$out/"
          chmod +x "$out"/emusen-core-conform* || true
          ls -la "$out"/*marsrt* "$out"/*mercuryrt* "$out"/*moonrt* "$out"/*venusrt* "$out"/*v1_test_core* "$out"/*v1_plain_core*

      # Printed in full, so each platform's digests can be read off the log.
      - name: Test the platform digests
        working-directory: EmuSen-Project
        run: dotnet test EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release --no-build --filter "FullyQualifiedName~MercuryRtPlatformTests" --logger "console;verbosity=detailed"

      - name: Test the Rust cores against the C# cores
        working-directory: EmuSen-Project
        run: dotnet test EmuSen.WiseMan/EmuSen.WiseMan.csproj -c Release --no-build --filter "FullyQualifiedName~MarsRt|FullyQualifiedName~MarsRT|FullyQualifiedName~MarsNative|FullyQualifiedName~MercuryRt|FullyQualifiedName~MoonRtState|FullyQualifiedName~VenusRtTestRomRunner|FullyQualifiedName~CoreAbi|FullyQualifiedName~CoreAdapter|FullyQualifiedName~CoreDiscovery" --logger "console;verbosity=normal" --logger "trx;LogFileName=wiseman-${{ matrix.rid }}.trx" --results-directory "${{ github.workspace }}/results"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiseman-${{ matrix.rid }}
          path: results
          if-no-files-found: ignore
