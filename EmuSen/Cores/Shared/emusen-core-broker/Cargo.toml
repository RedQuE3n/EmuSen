[package]
name = "emusen-core-broker"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# Any v1 core in a confined process of its own behind the same v1 surface: the proxy's machinery, which a proxy library
# builds on, and the runner. See EmuSen_LibretroHost.md §3 and EmuSen_CoreAPI.md §7.3.
[lib]
name = "emusen_core_broker"

[[bin]]
name = "emusen-core-runner"
path = "src/bin/emusen-core-runner.rs"

[dependencies]
emusen-native = { path = "../emusen-native" }
emusen-core-host = { path = "../emusen-core-host" }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

# The libretro proxy, host and test core, built as shared libraries beside the tests that run them brokered.
[dev-dependencies]
# The runtime's listing read back as JSON.
serde_json = "1.0.154"
emusen-libretro-proxy = { path = "../../Libretro/emusen-libretro-proxy" }
emusen-libretro-host = { path = "../../Libretro/emusen-libretro-host" }
emusen-libretro-testcore = { path = "../../Libretro/emusen-libretro-testcore" }
# The entry's private folders, where a test links a file into the core's system folder (EmuSen_LibretroHost.md §10n).
emusen-core-entry = { path = "../../../../Platform/core-entry" }
# The Rust runtime that discovers an installed entry, admits it and opens a game on it (EmuSen_LibretroHost.md §10k).
emusen-crystal = { path = "../../../../Platform/crystal" }
emusen-galaxia = { path = "../../../../Platform/galaxia" }
# The host's side of the ring, lent to a brokered core across the process boundary.
emusen-serenity = { path = "../../../../Platform/serenity" }
# The platform library's frontend API and Serenity exports, through which the ring is lent and drawn as Mistress does.
emusen-platform = { path = "../../../../Platform/platform" }

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true

[profile.release]
panic = "abort"

# What a publish builds (cargo xtask stage): release without its debug information.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"
