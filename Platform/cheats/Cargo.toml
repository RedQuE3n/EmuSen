[package]
name = "emusen-cheats"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The cheat files and the player's cheat database: RetroArch's .cht read and written, the .cht tree indexed and searched, its systems pruned, and a downloaded archive installed. The download is emusen-net's, the platform's HTTP client (EmuSen_Backend.md §16). See EmuSen_Cheats.md, `man cheat` and EmuSen_Backend.md §15.
[lib]
name = "emusen_cheats"

[dependencies]
# Each console's codecs, by which a .cht code becomes writes.
emusen-systems = { path = "../systems" }
# Paths, how a folder is listed, and the zip reader.
emusen-galaxia = { path = "../galaxia" }
emusen-dotnet = { path = "../dotnet" }
