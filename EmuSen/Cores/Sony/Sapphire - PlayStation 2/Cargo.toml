[package]
name = "sapphire"
version = "0.1.0"
edition = "2024"
publish = false

# Sapphire, the Sony PlayStation 2 core in Rust, on the core ABI v1. See Sapphire_Plan.md and Sapphire_Native.md.
[lib]
name = "sapphire"
crate-type = ["cdylib", "rlib"]

[dependencies]
emusen-native = { path = "../../Shared/emusen-native" }
# The R5900's decode, which the interpreter executes by (Sapphire_Plan.md §9.1), and the assembler of the project's programs.
emusen-mips = { path = "../../Shared/emusen-mips" }
# The IOP's processor, the R3000A, used as its crate's design intends with Sapphire's own IOP bus (Sapphire_Plan.md §9.2).
blackmoon-r3000 = { path = "../BlackMoon-HW/blackmoon-r3000" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# What ships: release without the line tables a sampler reads - see Mars_Native.md §6.3.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true
