[package]
name = "emusen-galaxia"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The librarian: where a file lives and how it is read and written safely. See EmuSen_Galaxia.md and EmuSen_RustPlatform.md §4.1.
[lib]
name = "emusen_galaxia"

[dependencies]
md-5 = "0.11"
# The unpacked folder's name, a hash of the archive's path, length and time (disc_set.rs); the workspace's, from DianaSh and Serenity.
sha2 = "0.11"
# SHA-1 beside them, which ScreenScraper asks for (EmuSen_Backend.md §30.4, decided 2026-10-18).
sha1 = "0.11"
# A sheet's and a list's meaning, for the files an image brings beside it (image_sets.rs).
emusen-disc = { path = "../../EmuSen/Cores/Shared/emusen-disc" }
# A tree walked with its links followed (files.rs, EmuSen_RustPlatform.md §47.17).
walkdir.workspace = true
# Zips read: a game's, a package's, a core's download and the cheat database (archive.rs, EmuSen_RustPlatform.md §47.15).
zip.workspace = true
# The system's folder for a program's settings, on every system the project builds for (tree.rs).
dirs.workspace = true
# Config files read and written as typed models; a hand-edited one read with comments and trailing commas (config_json.rs, EmuSen_RustPlatform.md §47.19).
serde.workspace = true
serde_json.workspace = true
jsonc-parser.workspace = true
# A model's maps keep the file's order (models.rs).
indexmap.workspace = true
# Times: the ticks stored, the round-trip text written and read, and the system zone's offset (clock.rs, EmuSen_RustPlatform.md §47.20).
time.workspace = true
# A file mapped read-only, on every system the project builds for (mapped.rs).
memmap2 = "0.9"

[dev-dependencies]

# The page cache asked directly, for the test that advised bytes reach memory (tests/advise.rs).
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
