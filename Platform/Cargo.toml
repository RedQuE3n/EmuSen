# The platform above the cores: Galaxia, Endymion and Serenity's Vulkan half, linked into one library, emusen_platform. See EmuSen_RustPlatform.md §2.
[workspace]
resolver = "3"
members = ["endymion", "galaxia", "platform"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# The cores' profiles: a panic aborts once the crash log is written, so nothing unwinds across the C layer.
[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1

# A publish's build: release without its debug information.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"
