[package]
name = "sapphire"
version = "0.1.0"
edition = "2024"
publish = false

# Sapphire, the Sony PlayStation 2 core in Rust, on the core ABI v1. See Sapphire_Plan.md and Sapphire_Native.md.
[lib]
name = "sapphire"
crate-type = ["cdylib", "rlib"]

[dependencies]
emusen-native = { path = "../../Shared/emusen-native" }
# The R5900's decode, which the interpreter executes by (Sapphire_Plan.md §9.1), and the assembler of the project's programs.
emusen-mips = { path = "../../Shared/emusen-mips" }
# The IOP's processor, the R3000A, used as its crate's design intends with Sapphire's own IOP bus (Sapphire_Plan.md §9.2).
blackmoon-r3000 = { path = "../BlackMoon-HW/blackmoon-r3000" }
# The SPU's voices, envelopes, noise and reverb algorithm, Diamond's moved out for both cores of the SPU2 (Sapphire_Plan.md §9.3).
blackmoon-spu = { path = "../BlackMoon-HW/blackmoon-spu" }
# Discs as sectors, CDs and DVDs, which the CDVD drive reads (Sapphire_Plan.md §9.4).
emusen-disc = { path = "../../Shared/emusen-disc" }
# The EE recompiler's thread, publication, module, code budget and verifier, shared with MarsRT (Sapphire_Plan.md §9.6, Sapphire_Native.md §44).
emusen-jit = { path = "../../Shared/emusen-jit" }
# The code generator the EE's lowering writes IR for; Apache-2.0 WITH LLVM-exception, compatible with the GPL-3.0. See EmuSen_Jit.md.
cranelift-codegen = "0.136.0"
cranelift-frontend = "0.136.0"
cranelift-jit = "0.136.0"
cranelift-module = "0.136.0"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# What ships: release without the line tables a sampler reads - see Mars_Native.md §6.3.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true
