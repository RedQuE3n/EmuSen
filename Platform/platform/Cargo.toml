[package]
name = "emusen-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The one library the C# programs load: the C layer over each platform crate, and nothing else. See EmuSen_RustPlatform.md §2.2 and §3.
[lib]
name = "emusen_platform"
crate-type = ["cdylib", "rlib"]

[dependencies]
emusen-endymion = { path = "../endymion" }
emusen-galaxia = { path = "../galaxia" }
emusen-native = { path = "../../EmuSen/Cores/Shared/emusen-native" }
# The set module, which reads a sheet's companions and an .m3u for the runtime (EmuSen_CoreAPI_Extensions.md §2.3).
emusen-disc = { path = "../../EmuSen/Cores/Shared/emusen-disc" }
emusen-serenity = { path = "../serenity" }
