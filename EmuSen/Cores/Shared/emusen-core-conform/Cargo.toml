[package]
name = "emusen-core-conform"
version = "0.1.0"
edition = "2024"
publish = false

# The conformance kit's core suite: loads a library through the core ABI v1 and nothing else, and runs C1-C15 on an
# image its author supplies, or on a library of images; also writes a library's sidecar. See EmuSen_CoreAPI.md §12,
# §21, §24 and §28.
[lib]
name = "emusen_core_conform"

[[bin]]
name = "emusen-core-conform"
path = "src/main.rs"

[dependencies]
emusen-native = { path = "../emusen-native" }
libloading = "0.8"

# The two test cores, built here as well so that this crate's tests run the kit on them.
[[example]]
name = "kit_test_core"
crate-type = ["cdylib"]

[[example]]
name = "kit_plain_core"
crate-type = ["cdylib"]

[[example]]
name = "kit_faulty_core"
crate-type = ["cdylib"]

[[example]]
name = "kit_lenient_core"
crate-type = ["cdylib"]

[[example]]
name = "kit_faulty_full_core"
crate-type = ["cdylib"]
