[package]
name = "diamond-renderer"
version = "0.1.0"
edition = "2024"
publish = false

# Diamond's picture drawn on a Vulkan compute device from the GPU's command stream, beside the software rasteriser, which
# keeps VRAM: a layer the machine never reads. See Diamond_Enhancements.md §14 on.
[lib]
name = "diamond_renderer"

[dependencies]
diamond = { path = ".." }
blackmoon-gte = { path = "../../BlackMoon-HW/blackmoon-gte" }
emusen-gpu = { path = "../../../Shared/emusen-gpu" }
emusen-native = { path = "../../../Shared/emusen-native" }
# What a polygon's precise vertices are, and the drawer's side of the pairing (Diamond_Enhancements.md §24.1).
precision = { path = "../precision" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true
