[package]
name = "emusen-testing-module"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# emusen.testing, the testing studio as a command module (EmuSen_Testing.md): `units`, `impact`, `trial`, `results`,
# `ingest` and `queue` over one SQLite store. A developer's tool: linked into the standalone dianash program, never into
# the platform library, exactly as emusen.dev is.
[lib]
name = "emusen_testing_module"

[dependencies]
# JSON text written by serde_json.
serde_json.workspace = true
dianash-module = { path = "../dianash-module" }
emusen-sqlite = { path = "../sqlite" }
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
