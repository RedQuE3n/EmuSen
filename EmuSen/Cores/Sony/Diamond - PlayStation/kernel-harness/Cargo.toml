[package]
name = "diamond-kernel-harness"
version = "0.1.0"
edition = "2024"
publish = false

# The open kernel's host side: its image from the ELF and the rebuild check, a minimal bus to run it on
# blackmoon-r3000, and the call table printed from its source. See Diamond_OpenKernel.md §6 and §7.
[lib]
name = "diamond_kernel_harness"

[[bin]]
name = "diamond-kernel"
path = "src/tool.rs"

[dependencies]
blackmoon-r3000 = { path = "../../BlackMoon-HW/blackmoon-r3000" }
emusen-mips = { path = "../../../Shared/emusen-mips" }

# The host's memory card file system, against which a card the kernel writes is read (EmuSen_Backend.md F21, D14).
[dev-dependencies]
emusen-psx-card = { path = "../../../Shared/emusen-psx-card" }

# Its own root, beside the kernel's.
[workspace]

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true
