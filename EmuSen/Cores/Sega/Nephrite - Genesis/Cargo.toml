[package]
name = "nephrite"
version = "0.1.0"
edition = "2024"
publish = false

# Nephrite, the Genesis / Mega Drive core in Rust with the Sega CD and the 32X as its attachments, on the core ABI v1. See Nephrite_Plan.md and Nephrite_Native.md.
[lib]
name = "nephrite"
crate-type = ["cdylib", "rlib"]

[dependencies]
emusen-native = { path = "../../Shared/emusen-native" }
beryl-m68k = { path = "../Beryl-HW/beryl-m68k" }
beryl-z80 = { path = "../Beryl-HW/beryl-z80" }
beryl-sh2 = { path = "../Beryl-HW/beryl-sh2" }
beryl-sn76489 = { path = "../Beryl-HW/beryl-sn76489" }
emusen-disc = { path = "../../Shared/emusen-disc", optional = true }

# The host's backup RAM file system, held equal to the open BIOS's by a round trip in its tests (EmuSen_Backend.md F21, D14).
[dev-dependencies]
emusen-mcd-bram = { path = "../../Shared/emusen-mcd-bram" }

# The open Sega CD BIOS is assembled at build time (Nephrite_OpenBios.md).
[build-dependencies]
beryl-m68k = { path = "../Beryl-HW/beryl-m68k", features = ["asm"] }

# The attachments, both built by default; each off is a check of the boundary, never a shipped library
# (Nephrite_Attachments.md §5.4).
[features]
default = ["mcd", "s32x"]
mcd = ["dep:emusen-disc"]
s32x = []

[[example]]
name = "bench"
required-features = ["mcd"]

[[example]]
name = "digest"
required-features = ["mcd"]

[[example]]
name = "disc"
required-features = ["mcd"]

[[example]]
name = "waits"
required-features = ["mcd"]

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# What ships: release without the line tables a sampler reads - see Mars_Native.md §6.3.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"
