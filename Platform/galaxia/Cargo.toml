[package]
name = "emusen-galaxia"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The librarian: where a file lives and how it is read and written safely. See EmuSen_Galaxia.md and EmuSen_RustPlatform.md §4.1.
[lib]
name = "emusen_galaxia"

[dependencies]
# .NET's text rules and File.ReadAllText's decoding, which the shell's command modules share without linking Galaxia.
emusen-dotnet = { path = "../dotnet" }
md-5 = "0.11"
# The unpacked folder's name, a hash of the archive's path, length and time (disc_set.rs); the workspace's, from DianaSh and Serenity.
sha2 = "0.11"
# SHA-1 beside them, which ScreenScraper asks for (EmuSen_Backend.md §30.4, decided 2026-10-18).
sha1 = "0.11"
# A sheet's and a list's meaning, for the files an image brings beside it (image_sets.rs).
emusen-disc = { path = "../../EmuSen/Cores/Shared/emusen-disc" }
# Inflate, for an archive entry's first bytes (archive.rs); the workspace's, from emusen-cheats.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# A file mapped read-only, on every system the project builds for (mapped.rs).
memmap2 = "0.9"

# The system's offset from UTC at an instant, for local times as .NET writes them (clock.rs); the workspace's, from
# emusen-library.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The page cache asked directly, for the test that advised bytes reach memory (tests/advise.rs).
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
