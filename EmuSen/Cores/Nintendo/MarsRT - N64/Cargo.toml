[package]
name = "marsrt"
version = "0.1.0"
edition = "2024"
publish = false

# MarsRT, the N64 core in Rust, and the C# Mars's opt-in native components, behind a C ABI. See Mars_Native.md.
[lib]
name = "marsrt"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The recompiler's code generator; Apache-2.0 WITH LLVM-exception, compatible with the GPL-3.0. See Mars_Native.md §5.8.
cranelift-codegen = "0.136.0"
cranelift-frontend = "0.136.0"
cranelift-jit = "0.136.0"
cranelift-module = "0.136.0"
cranelift-native = "0.136.0"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
