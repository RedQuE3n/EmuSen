[package]
name = "diamond-kernel"
version = "0.1.0"
edition = "2024"
publish = false

# Diamond's open BIOS kernel: a MIPS program for the BIOS's 512 KiB at BFC00000h, built for mipsel-sony-psx by the
# pinned nightly of rust-toolchain.toml and committed as diamond-kernel.bin. See Diamond_OpenKernel.md.
[[bin]]
name = "diamond-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]

# Its own root: no host workspace builds it.
[workspace]

[profile.release]
panic = "abort"
opt-level = 2
lto = "fat"
codegen-units = 1
debug = false
incremental = false
