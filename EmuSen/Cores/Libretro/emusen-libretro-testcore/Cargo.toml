[package]
name = "emusen-libretro-testcore"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# A libretro core of the project's own, an option for each behaviour the libretro host must meet. See EmuSen_LibretroHost.md §9.
[lib]
name = "emusen_libretro_testcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
emusen-libretro-sys = { path = "../emusen-libretro-sys" }
libc = "0.2"
# Vulkan's types and calls for its Vulkan picture, reached through the host's get_instance_proc_addr; no loader.
ash = { version = "0.38", default-features = false, features = ["std"] }

[profile.release]
panic = "abort"

# What a publish builds (cargo xtask stage): release without its debug information.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"
