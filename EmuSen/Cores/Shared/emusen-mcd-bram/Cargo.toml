[package]
name = "emusen-mcd-bram"
version = "0.1.0"
edition = "2024"
publish = false

# The Sega CD backup RAM's file system, the internal RAM's and a RAM cartridge's alike, with no standard library and no
# allocation, every edit made in place: the host's card tool reads and edits a backup RAM through it, and an open
# firmware may build on it. See Hardware/Shared/EmuSen_MediumFormats.md and EmuSen_Backend.md D14.
[lib]
name = "emusen_mcd_bram"

[dependencies]

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true
