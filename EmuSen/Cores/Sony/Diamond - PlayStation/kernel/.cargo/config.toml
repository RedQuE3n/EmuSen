# The tier-3 target needs core built from source; location-detail=none keeps the sysroot's paths out of the image.
# GP is the game's: small sections enabled with a threshold of 0 make LLVM reserve it and place nothing there.
[build]
target = "mipsel-sony-psx"
rustflags = [
    "-Z", "location-detail=none",
    "-C", "target-feature=+noabicalls",
    "-C", "llvm-args=-mgpopt",
    "-C", "llvm-args=-mips-ssection-threshold=0",
]

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
