[package]
name = "beryl-z80"
version = "0.1.0"
edition = "2024"
publish = false

# Beryl's Zilog Z80: the Genesis's sound CPU, and later the Master System's and the Game Gear's main CPU, written from Zilog's manual and graded by SingleStepTests. See Nephrite_Plan.md §8 and Beryl_Z80.md.
[lib]
name = "beryl_z80"

# The assembler is a development tool, for test programs and the open boot programs built at compile time (Beryl_Z80.md §8).
[features]
asm = ["dep:beryl-asm"]

[dependencies]
emusen-native = { path = "../../../Shared/emusen-native" }
beryl-asm = { path = "../beryl-asm", optional = true }

[dev-dependencies]
emusen-singlestep = { path = "../../../Shared/emusen-singlestep" }

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true
