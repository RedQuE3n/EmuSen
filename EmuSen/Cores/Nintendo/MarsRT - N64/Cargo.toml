[package]
name = "marsrt"
version = "0.1.0"
edition = "2024"
publish = false

# MarsRT, the N64 core in Rust, and the C# Mars's opt-in native components, behind a C ABI. See Mars_Native.md.
[lib]
name = "marsrt"
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
