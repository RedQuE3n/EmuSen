[package]
name = "mercuryrt"
version = "0.1.0"
edition = "2024"
publish = false

# MercuryRT, the Game Boy and Game Boy Color core in Rust, behind a C ABI. See Mercury_Native.md.
[lib]
name = "mercuryrt"
crate-type = ["cdylib", "rlib"]

[dependencies]
emusen-native = { path = "../../Shared/emusen-native" }
# The SM83 as text, the decoder DEBUG_DISASSEMBLE answers with and the Game Boy pack shares (EmuSen_Backend.md §17.2 D10).
silvermillennium-sm83 = { path = "../SilverMillennium-HW/silvermillennium-sm83" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# What ships: release without the line tables a sampler reads - see Mars_Native.md §6.3.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true
