# The platform above the cores: Galaxia, Endymion and Serenity's Vulkan half, linked into one library, emusen_platform. See EmuSen_RustPlatform.md §2.
[workspace]
resolver = "3"
members = ["cheats", "patch", "core-entry", "core-tool", "tool-job", "library-tool", "emusen-library-module", "emusen-cores-module", "emusen-memcard-module", "emusen-scrape-module", "crystal-debug", "dianash", "dianash-module", "dianash-program", "dianash-text", "dotnet", "emusen-cheat", "emusen-debug", "emusen-dev-module", "emusen-testing-module", "emusen-session", "emusen-trace", "endymion", "firmware", "galaxia", "net", "platform", "savemedia", "serenity", "session-service", "sqlite", "suggest", "systems", "crystal", "library", "scrape", "recorder"]

# One owner for each outside crate the platform's crates share, so that each version is stated once (EmuSen_RustPlatform.md §47).
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
dirs = "7.0.0"
strsim = "0.11.1"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# The cores' profiles: a panic aborts once the crash log is written, so nothing unwinds across the C layer.
[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1

# A publish's build: release without its debug information.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true

# What a land tests with: release without cross-crate LTO, in sixteen incremental units, so a change rebuilds in minutes - see EmuSen_RustPlatform.md §37.6.
[profile.test-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
