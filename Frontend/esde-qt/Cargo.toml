[package]
name = "emusen-esde-qt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "emusen-esde-qt"

# The ES-DE painter, the QML module EmuSen.Esde 1.1 (EmuSen_Qt.md §4.8): the scene's records of emusen-esde put on Qt Quick items.
[lib]
name = "emusen_esde_qt"

[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
# The scene and its marks, plain data with no Qt (EmuSen_Qt.md §4.5).
emusen-esde = { path = "../esde" }
# ES-DE's text rules over a face (EmuSen_Qt.md §4.9), laid out for TextLayout.
emusen-esde-text = { path = "../esde-text" }
# The library's texts (EmuSen_Qt.md §4.6) read as JSON, the shelves straight into rows.
serde.workspace = true
serde_json.workspace = true
# The kit's QML module (the body face, the help bar, the pad router) and its conversions to Qt's types.
emusen-kit-qt.workspace = true
# The kit's buttons and pad places (UiButton, PadControl), the one owner of the face-to-function table.
emusen-kit-core.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

[dev-dependencies]
emusen-qt-test.workspace = true
