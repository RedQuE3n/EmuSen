[package]
name = "moonrt"
version = "0.1.0"
edition = "2024"
publish = false

# MoonRT, the NES core in Rust, behind a C ABI. See Moon_Native.md.
[lib]
name = "moonrt"
crate-type = ["cdylib", "rlib"]

[dependencies]
emusen-native = { path = "../../Shared/emusen-native" }
# The 6502 instruction set as text, the NES pack disassembling with the same table (EmuSen_Backend.md §21).
emusen-6502 = { path = "../../Shared/emusen-6502" }

# A build of seconds, not minutes, depends on the CPU's bus cycle staying out of line - see Moon_Native.md §8.6.
[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# What ships: release without the line tables a sampler reads - see Mars_Native.md §6.3.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true
