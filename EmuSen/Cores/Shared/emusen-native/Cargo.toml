[package]
name = "emusen-native"
version = "0.1.0"
edition = "2024"
publish = false

# What every Rust core builds from: its save state (codec, layout listing, naming rule and state exports), its audio queue and the common native interface. See EmuSen_RustState.md and EmuSen_NativeCores.md.
[lib]
name = "emusen_native"

[dependencies]

# A core on the v1 ABI claiming every capability, for the crate's tests, the ABI check and CI's export check.
[[example]]
name = "v1_test_core"
crate-type = ["cdylib"]

# The same machine claiming no capability, for a host's neutral answers and the kit on a core with nothing optional.
[[example]]
name = "v1_plain_core"
crate-type = ["cdylib"]
