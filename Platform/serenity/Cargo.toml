[package]
name = "emusen-serenity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Serenity's slang half: presets, sources, parameters, Shaderc, reflection, the SPIR-V cache, the Vulkan device and the chain. See EmuSen_Serenity.md §7 to §10 and EmuSen_RustPlatform.md §4.3, §16 and §17.
[lib]
name = "emusen_serenity"

[dependencies]
# Vulkan's declarations, for the device and the chain; the system's loader is opened through libloading below, so ash brings no loader of its own.
ash = { version = "0.38", default-features = false, features = ["std", "debug"] }
# .NET's path and text rules, and the JSON the results cross in.
emusen-galaxia = { path = "../galaxia" }
# Shaderc, called in the library the program ships (§2.8), and Vulkan's loader, which is the system's.
libloading = "0.9"
# SQLite as the program ships it, shared with the library.
emusen-sqlite = { path = "../sqlite" }
# The cache's keys and each row's digest.
sha2 = "0.11"
