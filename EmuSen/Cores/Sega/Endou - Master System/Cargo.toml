[package]
name = "endou"
version = "0.1.0"
edition = "2024"
publish = false

# Endou, the Sega Master System core in Rust, with the Mark III and the SG-1000's cartridges, on the core ABI v1. See
# Endou_Plan.md and Endou_Native.md.
[lib]
name = "endou"
crate-type = ["cdylib", "rlib"]

[dependencies]
emusen-native = { path = "../../Shared/emusen-native" }
beryl-z80 = { path = "../Beryl-HW/beryl-z80" }
beryl-sn76489 = { path = "../Beryl-HW/beryl-sn76489" }
beryl-sms-vdp = { path = "../Beryl-HW/beryl-sms-vdp" }
beryl-sms-colours = { path = "../Beryl-HW/beryl-sms-colours" }

# The test programs are assembled with Beryl's Z80 assembler (Beryl_Z80.md §8, Endou_Native.md §9.8).
[dev-dependencies]
beryl-z80 = { path = "../Beryl-HW/beryl-z80", features = ["asm"] }

# The open boot program is assembled at build time, its letters Beryl's font (Endou_OpenBoot.md §3).
[build-dependencies]
beryl-z80 = { path = "../Beryl-HW/beryl-z80", features = ["asm"] }
beryl-font = { path = "../Beryl-HW/beryl-font" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# What ships: release without the line tables a sampler reads - see Mars_Native.md §6.3.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true
