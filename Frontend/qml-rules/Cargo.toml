[package]
name = "emusen-qml-rules"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# The qml-rules checker of EmuSen_Qt.md §1.3: QML is layout only. A library the emusen.dev command module exposes as `qml-rules`.
# Outside the Frontend workspace with its own lock file, like kit-core: tests/fence.rs holds its tree to no Qt, no cxx-qt and no
# crate of the front end, since the back end's dev module depends on it (EmuSen_Kit.md §7.9).
[lib]
name = "emusen_qml_rules"
