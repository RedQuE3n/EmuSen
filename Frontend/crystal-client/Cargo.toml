[package]
name = "emusen-crystal-client"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# A safe Rust binding over the frontend API, emusen_crystal.h 2.x, and the session service's table it hands out; no Qt.
# See EmuSen_Qt.md §1.1.1.
[lib]
name = "emusen_crystal_client"

[dependencies]
# The library loaded by its path, as bindgen's generated loader does it (src/raw.rs).
libloading = "0.8"
# The JSON shapes the header names, read into typed records.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The error type's words.
thiserror = "2"

[dev-dependencies]
# The generated module regenerated from the header and compared (tests/binding.rs).
bindgen = "0.72"
# The platform library and the test core built from this commit, and a scratch tree.
emusen-client-fixture = { path = "../client-fixture" }
