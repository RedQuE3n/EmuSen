[package]
name = "emusen-qt-play"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "emusen-qt-play"

# A game through the ring (EmuSen_Qt.md §1.8, §7's stage 1): Serenity's device adopted by the window's scene graph, a
# game's picture in GamePicture, and the picture's gate measured in the real window.
[lib]
name = "emusen_qt_play"
# The library holds the window's bindings and no tests; its test binary would link Qt's initialisers for nothing.
test = false
doctest = false

[[bin]]
name = "emusen-qt-play"
path = "src/main.rs"

[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
emusen-kit-qt.workspace = true
emusen-qt-models = { path = "../qt-models" }
# The pads' one reader, for the interface and the game (EmuSen_Kit.md §7.17).
emusen-qt-endymion = { path = "../qt-endymion" }
emusen-platform-client = { path = "../platform-client" }

[build-dependencies]
cxx-qt-build.workspace = true

[dev-dependencies]
# The QML rules and qmllint over the program's window (EmuSen_Qt.md §1.3).
emusen-qt-test.workspace = true
# The window's pads, played by SDL's virtual pads on the test core (tests/pads.rs).
emusen-client-fixture = { path = "../client-fixture" }
emusen-crystal-client = { path = "../crystal-client" }
emusen-kit-core.workspace = true
