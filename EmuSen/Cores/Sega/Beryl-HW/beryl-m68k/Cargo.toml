[package]
name = "beryl-m68k"
version = "0.1.0"
edition = "2024"
publish = false

# Beryl's Motorola 68000: the Genesis's main CPU and the Sega CD's sub-CPU, written from Motorola's manuals and graded by SingleStepTests. See Nephrite_Plan.md §8 and Beryl_M68k.md.
[lib]
name = "beryl_m68k"

# The assembler is a development tool, for test programs and the open firmware built at compile time (Beryl_M68k.md §8).
[features]
asm = ["dep:beryl-asm"]

[dependencies]
emusen-native = { path = "../../../Shared/emusen-native" }
beryl-asm = { path = "../beryl-asm", optional = true }

# What CI tests with: release with overflow checks on, so an arithmetic wrap nobody wrote fails a test - see EmuSen_RustPlatform.md §37.
[profile.test-checked]
inherits = "release"
overflow-checks = true
