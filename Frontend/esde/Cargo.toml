[package]
name = "emusen-esde"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# The ES-DE engine of EmuSen_Qt.md §4.2: `loader` (theme XML to resolved views), `scene` (each element's state at a time) and `check`
# (the esde-check corpus measure). Plain data in and out, no Qt: outside the Frontend workspace with its own lock file, like
# qml-rules, since the back end's dev module exposes `check` as the emusen.dev command esde-check; tests/fence.rs holds it to that.
[lib]
name = "emusen_esde"

[dependencies]
# MIT. A streaming XML reader that also reads fragments, which ES-DE's lenient reading of a file needs (EmuSen_Qt.md §4.2).
quick-xml = "0.38"
# MIT or Apache-2.0. The shelves' one schema, written by qt-models and read by esde-qt (EmuSen_Qt.md §4.15); the
# Frontend workspace's own version.
serde = { version = "1", features = ["derive"] }
