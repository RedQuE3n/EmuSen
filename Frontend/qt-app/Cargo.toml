[package]
name = "emusen-qt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "emusen-qt"

# The Qt front end as a program beside Mistress (EmuSen_Qt.md §7): Moonrise, then Home, Choose a console and the grid in
# the reference theme, over the view models; it reads the player's settings through the platform library, as Mistress does.
[lib]
name = "emusen_qt"

[[bin]]
name = "emusen-qt"
path = "src/main.rs"

[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
serde_json.workspace = true
emusen-kit-qt.workspace = true
emusen-qt-models = { path = "../qt-models" }
emusen-qt-endymion = { path = "../qt-endymion" }
# The game on its screen and under Home (Game.qml), and the adopted device its picture needs (EmuSen_Qt.md §1.8, §7.1).
emusen-qt-play = { path = "../qt-play" }
# The chosen EmuSen theme in its sandboxed engine, beside the reference's screens (EmuSen_Qt.md §3.5).
emusen-theme-host = { path = "../theme-host" }
# The settings read before the window opens (Moonrise on or off), through the platform library.
emusen-platform-client = { path = "../platform-client" }
# The gates' in-process pad (gate_pad.rs), absent from every build without the feature (EmuSen_Qt.md §9.3.6).
emusen-qt-test = { workspace = true, optional = true }
emusen-kit-core = { workspace = true, optional = true }

[features]
# Off by default and never in a player's build: the pad the start-up gates press, fed from a FIFO.
gate-pad = ["dep:emusen-qt-test", "dep:emusen-kit-core"]

[dev-dependencies]
emusen-crystal-client = { path = "../crystal-client" }
emusen-client-fixture = { path = "../client-fixture" }
emusen-kit-core.workspace = true
emusen-qt-test.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true
