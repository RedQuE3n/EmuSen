[package]
name = "diamond"
version = "0.1.0"
edition = "2024"
publish = false

# Diamond, the Sony PlayStation core in Rust: the machine and its `Core`. The published library is `v1/`'s, which holds
# it with its enhancements (Diamond_Enhancements.md §24.1). See Diamond_Plan.md and Diamond_Native.md.
[lib]
name = "diamond"
crate-type = ["rlib"]

[dependencies]
emusen-native = { path = "../../Shared/emusen-native" }
blackmoon-r3000 = { path = "../BlackMoon-HW/blackmoon-r3000" }
blackmoon-gte = { path = "../BlackMoon-HW/blackmoon-gte" }
emusen-disc = { path = "../../Shared/emusen-disc" }
emusen-mips = { path = "../../Shared/emusen-mips" }

[dev-dependencies]
# Its SHA-256, which pins the release code the record programs carry (tests/support/records.rs).
emusen-core-conform = { path = "../../Shared/emusen-core-conform" }
# The Vulkan renderer of stage E3, a layer the machine never reads, for the tools and the gate (Diamond_Enhancements.md §16).
diamond-renderer = { path = "renderer" }
# The precision layer of stage E4, for its gate (Diamond_Enhancements.md §23).
precision = { path = "precision" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# What ships: release without the line tables a sampler reads - see Mars_Native.md §6.3.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"
