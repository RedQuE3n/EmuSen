[package]
name = "emusen-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The one library the C# programs load: the C layer over each platform crate, and nothing else. See EmuSen_RustPlatform.md §2.2 and §3.
[lib]
name = "emusen_platform"
crate-type = ["cdylib", "rlib"]

[dependencies]
# DianaSh's shell core, whose host API this library exports (EmuSen_DianaSh.md §10).
emusen-dianash = { path = "../dianash" }
# dianash.text, the text tools' module every shell this library makes has linked in (§8.2).
dianash-text = { path = "../dianash-text" }
# The module ABI's trait, by which the linked modules are handed to each shell.
dianash-module = { path = "../dianash-module" }
# EmuSen's command modules over the session service, linked in beside it for the C# frontends' shells (§8.1, §13.11).
emusen-debug = { path = "../emusen-debug" }
emusen-trace = { path = "../emusen-trace" }
emusen-session = { path = "../emusen-session" }
emusen-cheat = { path = "../emusen-cheat" }
emusen-endymion = { path = "../endymion" }
emusen-galaxia = { path = "../galaxia" }
emusen-native = { path = "../../EmuSen/Cores/Shared/emusen-native" }
# The set module, which reads a sheet's companions and an .m3u for the runtime (EmuSen_CoreAPI_Extensions.md §2.3).
emusen-disc = { path = "../../EmuSen/Cores/Shared/emusen-disc" }
emusen-serenity = { path = "../serenity" }
# The systems table, what each console is (EmuSen_Backend.md §5, §12).
emusen-systems = { path = "../systems" }
# The file services, the store and the card manager and the cheat files (EmuSen_Backend.md §15).
emusen-firmware = { path = "../firmware" }
emusen-savemedia = { path = "../savemedia" }
emusen-cheats = { path = "../cheats" }
# The platform's one HTTP client, for the cheat database's download (EmuSen_Backend.md §16).
emusen-net = { path = "../net" }
# .NET's JSON, for the requests the systems' C layer reads.
emusen-dotnet = { path = "../dotnet" }
