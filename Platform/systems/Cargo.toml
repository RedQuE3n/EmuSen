[package]
name = "emusen-systems"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The systems table: what each console is, whichever engine runs it, one embedded data file per system. See EmuSen_Backend.md §5 and §12.
[lib]
name = "emusen_systems"

[dependencies]
# JSON as the C# reads it, and .NET's way of writing a double, so the table means the same to both halves.
emusen-dotnet = { path = "../dotnet" }
# Each save medium's file system, a crate with no standard library that an open firmware may also build on (EmuSen_Backend.md D14).
emusen-psx-card = { path = "../../EmuSen/Cores/Shared/emusen-psx-card" }
emusen-n64-pak = { path = "../../EmuSen/Cores/Shared/emusen-n64-pak" }
emusen-mcd-bram = { path = "../../EmuSen/Cores/Shared/emusen-mcd-bram" }
# The MIPS instruction set, for the VR4300's disassembly (EmuSen_Backend.md F8).
emusen-mips = { path = "../../EmuSen/Cores/Shared/emusen-mips" }
# The SM83 instruction set as text, which MercuryRT decodes with too (EmuSen_Backend.md §17.2 D10).
emusen-sm83 = { path = "../../EmuSen/Cores/Shared/emusen-sm83" }
# The 6502 instruction set as text, which MoonRT disassembles with too (EmuSen_Backend.md §21).
emusen-6502 = { path = "../../EmuSen/Cores/Shared/emusen-6502" }
