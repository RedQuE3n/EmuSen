# The Qt front end's cargo workspace (EmuSen_Qt.md §1.9): the kit's Qt half, its harness, the gallery and the checkers.
# emusen-kit-core and emusen-qml-rules stay outside it on purpose, each with its own lock file, so their fence tests can read what their trees name:
# the back end's dev module depends on qml-rules, which must never pull in Qt. The two client crates, their shared idioms and their test fixture stay outside for the same reason (EmuSen_Qt.md §1.1.1).
[workspace]
resolver = "2"
members = ["kit-qt", "qt-test", "kit-gallery"]
exclude = ["kit-core", "qml-rules", "crystal-client", "platform-client", "client-fixture", "c-calls"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
emusen-kit-core = { path = "kit-core" }
emusen-kit-qt = { path = "kit-qt" }
emusen-qml-rules = { path = "qml-rules" }
emusen-qt-test = { path = "qt-test" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
